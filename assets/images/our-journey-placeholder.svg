<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 560" width="1500" height="560" role="img" aria-label="Our Journey timeline from founding to today">
  <defs>
    <linearGradient id="journey-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f7f8fc"/>
    </linearGradient>
  </defs>
  <rect width="1500" height="560" fill="url(#journey-bg)"/>
  <text x="60" y="70" font-family="Poppins, Arial, sans-serif" font-size="40" font-weight="700" fill="#2c3374">Our Journey</text>
  <rect x="62" y="86" width="70" height="5" rx="2.5" fill="#f1ae44"/>
  <path d="M 90,320 C 172,320 172,220 255,220 C 338,220 338,320 420,320 C 502,320 502,200 585,200 C 668,200 668,320 750,320 C 832,320 832,220 915,220 C 998,220 998,320 1080,320 C 1162,320 1162,200 1245,200 C 1328,200 1328,320 1410,320 " fill="none" stroke="#cdd3ea" stroke-width="4" stroke-linecap="round"/>
  
    <circle cx="90" cy="320" r="10" fill="#F1AE44" stroke="#ffffff" stroke-width="3"/>
    <circle cx="90" cy="320" r="16" fill="none" stroke="#F1AE44" stroke-width="1.5" opacity="0.4"/>
    <text x="90" y="325" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="9" font-weight="700" fill="#ffffff" opacity="0">1</text>
    <g transform="translate(90,350)">
      <text text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3374">Birth of URJA CDC</text>
      <text text-anchor="middle" y="18" font-family="Arial, sans-serif" font-size="11.5" fill="#7a7a86">Started by Dr. Swati, +3 members</text>
    </g>
    
    <circle cx="255" cy="220" r="10" fill="#E07A86" stroke="#ffffff" stroke-width="3"/>
    <circle cx="255" cy="220" r="16" fill="none" stroke="#E07A86" stroke-width="1.5" opacity="0.4"/>
    <text x="255" y="225" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="9" font-weight="700" fill="#ffffff" opacity="0">2</text>
    <g transform="translate(255,186)">
      <text text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3374">Shivani joins</text>
      <text text-anchor="middle" y="18" font-family="Arial, sans-serif" font-size="11.5" fill="#7a7a86">Team grows to 7</text>
    </g>
    
    <circle cx="420" cy="320" r="10" fill="#5B7FB5" stroke="#ffffff" stroke-width="3"/>
    <circle cx="420" cy="320" r="16" fill="none" stroke="#5B7FB5" stroke-width="1.5" opacity="0.4"/>
    <text x="420" y="325" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="9" font-weight="700" fill="#ffffff" opacity="0">3</text>
    <g transform="translate(420,350)">
      <text text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3374">Unit expanded</text>
      <text text-anchor="middle" y="18" font-family="Arial, sans-serif" font-size="11.5" fill="#7a7a86">Double space, team grows to 10</text>
    </g>
    
    <circle cx="585" cy="200" r="10" fill="#5FAE7E" stroke="#ffffff" stroke-width="3"/>
    <circle cx="585" cy="200" r="16" fill="none" stroke="#5FAE7E" stroke-width="1.5" opacity="0.4"/>
    <text x="585" y="205" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="9" font-weight="700" fill="#ffffff" opacity="0">4</text>
    <g transform="translate(585,166)">
      <text text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3374">ABA services added</text>
      <text text-anchor="middle" y="18" font-family="Arial, sans-serif" font-size="11.5" fill="#7a7a86">Focus on Autism, team grows to 15+</text>
    </g>
    
    <circle cx="750" cy="320" r="10" fill="#8E6BB0" stroke="#ffffff" stroke-width="3"/>
    <circle cx="750" cy="320" r="16" fill="none" stroke="#8E6BB0" stroke-width="1.5" opacity="0.4"/>
    <text x="750" y="325" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="9" font-weight="700" fill="#ffffff" opacity="0">5</text>
    <g transform="translate(750,350)">
      <text text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3374">Bigger premises</text>
      <text text-anchor="middle" y="18" font-family="Arial, sans-serif" font-size="11.5" fill="#7a7a86">Sunshine Global Hospital, team grows to 22</text>
    </g>
    
    <circle cx="915" cy="220" r="10" fill="#F1AE44" stroke="#ffffff" stroke-width="3"/>
    <circle cx="915" cy="220" r="16" fill="none" stroke="#F1AE44" stroke-width="1.5" opacity="0.4"/>
    <text x="915" y="225" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="9" font-weight="700" fill="#ffffff" opacity="0">6</text>
    <g transform="translate(915,186)">
      <text text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3374">Independent setup</text>
      <text text-anchor="middle" y="18" font-family="Arial, sans-serif" font-size="11.5" fill="#7a7a86">Survived COVID-19</text>
    </g>
    
    <circle cx="1080" cy="320" r="10" fill="#E07A86" stroke="#ffffff" stroke-width="3"/>
    <circle cx="1080" cy="320" r="16" fill="none" stroke="#E07A86" stroke-width="1.5" opacity="0.4"/>
    <text x="1080" y="325" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="9" font-weight="700" fill="#ffffff" opacity="0">7</text>
    <g transform="translate(1080,350)">
      <text text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3374">Second unit opens</text>
      <text text-anchor="middle" y="18" font-family="Arial, sans-serif" font-size="11.5" fill="#7a7a86">Adajan Centre added</text>
    </g>
    
    <circle cx="1245" cy="200" r="10" fill="#5B7FB5" stroke="#ffffff" stroke-width="3"/>
    <circle cx="1245" cy="200" r="16" fill="none" stroke="#5B7FB5" stroke-width="1.5" opacity="0.4"/>
    <text x="1245" y="205" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="9" font-weight="700" fill="#ffffff" opacity="0">8</text>
    <g transform="translate(1245,166)">
      <text text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3374">Evolved to Sadbhaav</text>
      <text text-anchor="middle" y="18" font-family="Arial, sans-serif" font-size="11.5" fill="#7a7a86">Child Development Centre, team of 30+</text>
    </g>
    
    <circle cx="1410" cy="320" r="10" fill="#5FAE7E" stroke="#ffffff" stroke-width="3"/>
    <circle cx="1410" cy="320" r="16" fill="none" stroke="#5FAE7E" stroke-width="1.5" opacity="0.4"/>
    <text x="1410" y="325" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="9" font-weight="700" fill="#ffffff" opacity="0">9</text>
    <g transform="translate(1410,350)">
      <text text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="15" font-weight="700" fill="#2c3374">Sonia Adnani joins</text>
      <text text-anchor="middle" y="18" font-family="Arial, sans-serif" font-size="11.5" fill="#7a7a86">Now it's your turn to be one of us!</text>
    </g>
    
  <circle cx="90" cy="500" r="5" fill="#5B7FB5" opacity="0.5"/>
  <circle cx="1440" cy="120" r="7" fill="#F1AE44" opacity="0.5"/>
  <circle cx="1200" cy="480" r="6" fill="#5FAE7E" opacity="0.5"/>
</svg>